name: image

# Images take minutes and gigabytes, so they build only on demand or for a release tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  agent:
    uses: ./.github/workflows/agent.yml

  build:
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows
            runner: ubuntu-24.04
            arch: amd64
          - profile: mac
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: image
    steps:
      - uses: actions/checkout@v4
      - uses: systemd/mkosi@v27.1
      - uses: actions/download-artifact@v4
        with:
          name: ubit-agent-${{ matrix.arch }}
          path: agent-artifacts
      - name: Stage the agent package
        run: |
          mkdir -p mkosi.packages
          cp ../agent-artifacts/debian/ubit-agent_*.deb mkosi.packages/
      - name: Re-check Mozilla's APT key
        run: scripts/fetch-mozilla-key.sh
      - name: Build
        run: mkdir -p mkosi.output && mkosi --profile=${{ matrix.profile }} -f build
      - name: Check packages
        run: python3 scripts/check-manifest.py "$(find mkosi.output -maxdepth 1 -name '*.manifest' | head -n 1)"
      - name: Smoke test (boot + agent over vsock)
        if: matrix.profile == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          chmod +x ../agent-artifacts/release/ubit-hostsim
          sudo scripts/smoke-boot.sh "$(find mkosi.output -maxdepth 1 -type f -name '*.raw' | head -n 1)" \
            ../agent-artifacts/release/ubit-hostsim ../protocol/fixtures/valid/host_inventory-windows.json
      - name: Package
        run: |
          sudo apt-get install -y -qq qemu-utils zstd
          scripts/package.sh ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: ubit-image-${{ matrix.profile }}
          path: image/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ubit-image-*
          merge-multiple: true
          path: dist
      - name: Attach images to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "$GITHUB_REF_NAME" --notes "ubit images"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
