[workspace]
resolver = "3"
members = ["crates/protocol", "crates/scoring", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/saurintailor/ubitos"

[workspace.dependencies]
ubit-protocol = { path = "crates/protocol" }
ubit-scoring = { path = "crates/scoring" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "signal", "fs", "sync"] }
tokio-vsock = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sd-notify = "0.5"
humantime = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
