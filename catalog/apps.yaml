    weight: 1

  # --- Creative -----------------------------------------------------------------
  - id: design.photoshop
    category: apps
    name: Adobe Photoshop
    match:
      windows: ["Adobe Photoshop"]
      macos: ["com.adobe.Photoshop"]
    replacement: GIMP or Krita
