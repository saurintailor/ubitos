# ubit app catalog: which host apps map to which Linux replacement.
#
# Matching rules (see agent/crates/scoring):
#   windows: case-insensitive PREFIX match on the app's display name
#            (the Uninstall registry DisplayName), e.g. "Zoom" matches "Zoom Workplace".
#   macos:   case-insensitive EXACT match on the bundle identifier.
#
# status:  native       same app exists for Linux
#          alternative  a good open replacement does the same job
#          workaround   possible, but with friction (web version, compatibility layer)
#          blocker      no practical path today
# weight:  how much this app matters to an everyday switch (1-3).
#
# Change this file through pull requests; every entry is reviewed.

version: "2026.11.1"
entries:
  # --- Browsers ---------------------------------------------------------------
  - id: browser.chrome
    category: apps
    name: Google Chrome
    match:
      windows: ["Google Chrome"]
      macos: ["com.google.Chrome"]
    replacement: Firefox
    status: native
    weight: 3

  - id: browser.edge
    category: apps
    name: Microsoft Edge
    match:
      windows: ["Microsoft Edge"]
      macos: ["com.microsoft.edgemac"]
    replacement: Firefox
    status: native
    weight: 2

  - id: browser.safari
    category: apps
    name: Safari
    match:
      macos: ["com.apple.Safari"]
    replacement: Firefox
    status: native
    weight: 2

  - id: browser.firefox
    category: apps
    name: Firefox
    match:
      windows: ["Mozilla Firefox"]
      macos: ["org.mozilla.firefox"]
    replacement: Firefox
    status: native
    weight: 2

  - id: browser.brave
    category: apps
    name: Brave
    match:
      windows: ["Brave"]
      macos: ["com.brave.Browser"]
    replacement: Brave for Linux
    status: native
    weight: 2

  # --- Office and documents ---------------------------------------------------
  - id: office.microsoft365
    category: apps
    name: Microsoft 365 / Office
    match:
      windows: ["Microsoft 365", "Microsoft Office"]
      macos: ["com.microsoft.Word", "com.microsoft.Excel", "com.microsoft.Powerpoint"]
    replacement: LibreOffice or ONLYOFFICE
    status: alternative
    weight: 3

  - id: office.iwork
    category: apps
    name: Pages, Numbers, Keynote
    match:
      macos: ["com.apple.iWork.Pages", "com.apple.iWork.Numbers", "com.apple.iWork.Keynote"]
    replacement: LibreOffice
    status: alternative
    weight: 1

  - id: office.acrobat
    category: apps
    name: Adobe Acrobat
    match:
      windows: ["Adobe Acrobat"]
      macos: ["com.adobe.Acrobat.Pro", "com.adobe.Reader"]
    replacement: Okular
    status: alternative
    weight: 1

  # --- Mail ---------------------------------------------------------------------
  - id: mail.outlook
    category: apps
    name: Microsoft Outlook
    match:
      windows: ["Microsoft Outlook"]
      macos: ["com.microsoft.Outlook"]
    replacement: Thunderbird
    status: alternative
    weight: 2

  - id: mail.apple
    category: apps
    name: Apple Mail
    match:
      macos: ["com.apple.mail"]
    replacement: Thunderbird
    status: alternative
    weight: 1

  # --- Communication ------------------------------------------------------------
  - id: chat.slack
    category: apps
    name: Slack
    match:
      windows: ["Slack"]
      macos: ["com.tinyspeck.slackmacgap"]
    replacement: Slack for Linux
    status: native
    weight: 2

  - id: chat.discord
    category: apps
    name: Discord
    match:
      windows: ["Discord"]
      macos: ["com.hnc.Discord"]
    replacement: Discord for Linux
    status: native
    weight: 1

  - id: chat.zoom
    category: apps
    name: Zoom
    match:
      windows: ["Zoom"]
      macos: ["us.zoom.xos"]
    replacement: Zoom for Linux
    status: native
    weight: 2

  - id: chat.teams
    category: apps
    name: Microsoft Teams
    match:
      windows: ["Microsoft Teams"]
      macos: ["com.microsoft.teams2", "com.microsoft.teams"]
    replacement: Teams in the browser
    status: workaround
    weight: 2

  - id: chat.whatsapp
    category: apps
    name: WhatsApp
    match:
      windows: ["WhatsApp"]
      macos: ["net.whatsapp.WhatsApp"]
    replacement: WhatsApp Web in Firefox
    status: workaround
    weight: 1

  # --- Media --------------------------------------------------------------------
  - id: media.spotify
    category: apps
    name: Spotify
