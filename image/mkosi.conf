# ubit guest image: Ubuntu 26.04 LTS ("resolute") + KDE Plasma, one config, two hosts.
#
#   mkosi --profile=windows -f build   x86-64, for Hyper-V (scripts/package.sh makes the VHDX)
#   mkosi --profile=mac -f build       arm64, for Apple Virtualization.framework (raw image)
#
# Needs mkosi v27+. Before building, run scripts/fetch-mozilla-key.sh and put the
# ubit-agent .deb for the target architecture in mkosi.packages/.

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe

[Output]
ImageId=ubit
ImageVersion=0.1.0
Format=disk
Output=ubit
ManifestFormat=json

[Build]
# Build with an up-to-date tools tree (systemd-repart, ukify, apt) instead of the host's.
ToolsTree=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
# Root is found by systemd-gpt-auto; no root= needed.
KernelCommandLine=rw quiet splash
Hostname=ubit
Locale=en_US.UTF-8
Timezone=UTC

# Base system, KDE Plasma 6 with its X11 session (xrdp and spice-vdagent need X11),
# everyday apps, Firefox from Mozilla's APT repo (set up in mkosi.sandbox/, never the
# snap), and ubit-agent from mkosi.packages/.
Packages=
        systemd
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        sudo
        locales
        ca-certificates
        linux-image-generic
        network-manager
        plasma-desktop
        plasma-workspace
        kwin-x11
        plasma-nm
        plasma-pa
        sddm
        sddm-theme-breeze
        breeze
        breeze-gtk-theme
        kde-config-gtk-style
        xdg-desktop-portal-kde
        xserver-xorg-core
        xserver-xorg-input-libinput
        xwayland
        libgl1-mesa-dri
        pipewire
        pipewire-pulse
        wireplumber
        fonts-noto-core
        fonts-noto-color-emoji
        xdg-utils
        konsole
        dolphin
        kate
        ark
        okular
        gwenview
        spectacle
        kcalc
        firefox
        ubit-agent

# Never shipped: snapd, ubuntu-report, popularity-contest, apport, whoopsie,
# ubuntu-pro-client. None is requested above; snapd is pinned out in mkosi.sandbox/, and
# mkosi.postinst.chroot plus scripts/check-manifest.py fail the build if any appears.
