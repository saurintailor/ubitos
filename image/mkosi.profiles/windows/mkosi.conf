# x86-64, Hyper-V Generation 2. Display through the enhanced session (xrdp over hv_sock).
[Distribution]
Architecture=x86-64

[Content]
Packages=
        xrdp
        xorgxrdp
        linux-tools-virtual
        linux-cloud-tools-virtual
ExtraTrees=extra
PostInstallationScripts=windows.postinst.chroot
KernelCommandLine=console=tty0 console=ttyS0,115200
